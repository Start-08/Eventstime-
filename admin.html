<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin - Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= GLOBAL FIXES FOR MOBILE ================= */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
html, body {
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #f0f2f5;
}
.hidden{display:none!important}

#app{
  max-width:480px;
  margin:0 auto;
  height:100%;
  height:100dvh;
  background:#f8f9fa;
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 20px rgba(0,0,0,0.1);
}

/* ================= ANIMATIONS ================= */
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ================= LOGIN ================= */
#loginView{display:flex;flex-direction:column;height:100%;padding:40px 24px;justify-content:center;background:#fff}
.login-logo{font-size:2.5rem;font-weight:800;color:#026cdf;text-align:center;margin-bottom:8px;letter-spacing:-1px}
.login-sub{text-align:center;color:#666;margin-bottom:32px;font-size:.95rem}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:.8rem;font-weight:600;color:#444;margin-bottom:6px}
.input-group input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:1rem;outline:none;background:#fafafa}
.btn-blue{width:100%;padding:16px;background:#026cdf;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px}
.auth-err{color:#d93025;font-size:.85rem;text-align:center;margin-top:12px;font-weight:600;background:#fce8e8;padding:8px;border-radius:6px;display:none}
.auth-err.show{display:block}

/* ================= HEADER ================= */
header{background:#026cdf;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
header h1{font-size:1.3rem;font-weight:800;}
.hamburger{background:none;border:none;cursor:pointer;padding:4px;display:flex;flex-direction:column;gap:5px;z-index:100}
.hamburger span{display:block;width:24px;height:2.5px;background:#fff;border-radius:2px}

/* ================= SIDE MENU ================= */
.menu-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.5);z-index:40;opacity:0;pointer-events:none;transition:.3s}
.menu-backdrop.open{opacity:1;pointer-events:auto}
.side-menu{position:absolute;top:0;right:-260px;width:260px;height:100%;background:#fff;z-index:50;transition:right .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.side-menu.open{right:0}
.side-menu-header{padding:24px 20px;background:#026cdf;color:#fff}
.side-menu-header h2{font-size:1.2rem;font-weight:700}
.menu-links{flex:1;padding:10px 0;overflow-y:auto}
.menu-link{padding:16px 24px;display:flex;align-items:center;gap:12px;font-size:1rem;font-weight:600;color:#444;cursor:pointer;border-left:3px solid transparent}
.menu-link.active{background:#f0f7ff;color:#026cdf;border-left-color:#026cdf}
.menu-link svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.menu-footer{padding:20px;border-top:1px solid #eee}
.btn-logout{width:100%;padding:12px;background:#fff;color:#d93025;border:1px solid #d93025;border-radius:8px;font-weight:700;cursor:pointer}

/* ================= MAIN CONTENT ================= */
main{flex:1;overflow-y:auto;position:relative}
.tab-content{display:none;padding:20px}
.tab-content.active{display:block}
.section-title{font-size:1.1rem;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.btn-small{background:#026cdf;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer}

/* Cards */
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #eee}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-title{font-size:1.05rem;font-weight:700;}
.card-sub{font-size:.85rem;color:#666;margin-bottom:4px}
.card-data{font-size:.85rem;color:#333;margin-top:8px;background:#f8f9fa;padding:10px;border-radius:8px;border:1px solid #eee}
.badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:.7rem;font-weight:700;text-transform:uppercase}
.badge.pending{background:#fff3e0;color:#e65100}
.badge.awaiting-confirmation{background:#e3f2fd;color:#1565c0}
.badge.confirmed{background:#e8f5e9;color:#2e7d32}
.badge.cancelled{background:#ffebee;color:#c62828}

.action-row{display:flex;gap:8px;margin-top:12px}
.btn-confirm{flex:1;padding:10px;background:#00a650;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn-cancel{flex:1;padding:10px;background:#fff;color:#d93025;border:1px solid #d93025;border-radius:8px;font-weight:600;cursor:pointer}
.btn-delete{background:#ffebee;color:#d93025;border:none;padding:8px 12px;border-radius:6px;font-weight:600;cursor:pointer}

/* ================= MODAL ================= */
.modal{position:absolute;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;padding:20px}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:400px;max-height:90%;overflow-y:auto;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close-btn{background:none;border:none;font-size:1.5rem;color:#888;cursor:pointer}

.spinner{text-align:center;padding:20px;color:#666;}
</style>
</head>
<body>

<div id="app">
  <!-- LOGIN -->
  <div id="loginView">
    <div class="login-logo">Admin</div>
    <p class="login-sub">Sign in to manage events and orders.</p>
    <form onsubmit="handleLogin(event)">
      <div class="input-group"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="input-group"><label>Password</label><input type="password" id="loginPw" required></div>
      <button type="submit" class="btn-blue" id="loginBtn">Log In</button>
      <div class="auth-err" id="loginErr"></div>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="appView" class="hidden" style="height:100%;display:flex;flex-direction:column;">
    <header>
      <h1>Tickets Admin</h1>
      <button class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    </header>

    <!-- MENU -->
    <div class="menu-backdrop" id="menuBackdrop" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
      <div class="side-menu-header"><h2>Admin Panel</h2></div>
      <div class="menu-links">
        <div class="menu-link active" id="link-orders" onclick="switchTab('orders')">Orders</div>
        <div class="menu-link" id="link-events" onclick="switchTab('events')">Events</div>
        <div class="menu-link" id="link-users" onclick="switchTab('users')">Users</div>
      </div>
      <div class="menu-footer"><button class="btn-logout" onclick="handleLogout()">Sign Out</button></div>
    </div>

    <main>
      <div id="tab-orders" class="tab-content active">
        <div class="section-title">All Orders</div>
        <div id="ordersList"></div>
      </div>
      <div id="tab-events" class="tab-content">
        <div class="section-title">Events <button class="btn-small" onclick="openAddModal()">+ Add New</button></div>
        <div id="eventsList"></div>
      </div>
      <div id="tab-users" class="tab-content">
        <div class="section-title">Registered Users</div>
        <div id="usersList"></div>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div id="eventModal" class="modal">
    <div class="modal-box">
      <div class="modal-head"><h2>Add Event</h2><button class="close-btn" onclick="closeModal()">✕</button></div>
      <form onsubmit="addEvent(event)">
        <div class="input-group"><label>Title</label><input type="text" id="evTitle" required></div>
        <div class="input-group"><label>Date & Time</label><input type="text" id="evDate" required></div>
        <div class="input-group"><label>Venue</label><input type="text" id="evVenue" required></div>
        <div class="input-group"><label>Price ($)</label><input type="number" id="evPrice" required></div>
        <div class="input-group"><label>Image URL</label><input type="url" id="evImage" required></div>
        <div class="input-group"><label>Description</label><input type="text" id="evDesc" required></div>
        <button type="submit" class="btn-blue" id="addEventBtn">Save Event</button>
      </form>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAueqbCcGN_LKDTd6YnPkPcWSIufFqsqwM",
  authDomain: "fedex-4bdba.firebaseapp.com",
  projectId: "fedex-4bdba",
  storageBucket: "fedex-4bdba.firebasestorage.app",
  messagingSenderId: "770647474446",
  appId: "1:770647474446:web:8a3a4c595b2286e7ab575f"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n||0).toFixed(2);
const formatDate = ts => new Date(ts).toLocaleString();

function handleLogin(e) {
  e.preventDefault();
  $("loginBtn").disabled = true;
  auth.signInWithEmailAndPassword($("loginEmail").value.trim(), $("loginPw").value)
    .catch(() => { $("loginErr").textContent = "Invalid login"; $("loginErr").classList.add("show"); })
    .finally(() => $("loginBtn").disabled = false);
}

function handleLogout() { auth.signOut(); }

auth.onAuthStateChanged(user => {
  if (user) {
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    if (!window.adminStarted) {
      window.adminStarted = true;
      listenOrders(); listenEvents(); listenUsers();
    }
  } else {
    $("loginView").classList.remove("hidden");
    $("appView").classList.add("hidden");
  }
});

function toggleMenu() { $("sideMenu").classList.toggle("open"); $("menuBackdrop").classList.toggle("open"); }
function switchTab(tab) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".menu-link").forEach(el => el.classList.remove("active"));
  $("tab-" + tab).classList.add("active"); $("link-" + tab).classList.add("active");
  toggleMenu();
}

function listenOrders() {
  db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snap => {
    if (snap.empty) { $("ordersList").innerHTML = '<p class="spinner">No orders yet.</p>'; return; }
    let html = "";
    snap.forEach(doc => {
      const o = doc.data(); const id = doc.id;
      html += `<div class="card">
        <div class="card-header"><div class="card-title">${esc(o.eventTitle)}</div><div class="badge ${esc(o.status)}">${esc(o.status)}</div></div>
        <div class="card-sub"><strong>Customer:</strong> ${esc(o.customerName)}</div>
        <div class="card-sub"><strong>Email:</strong> ${esc(o.customerEmail)}</div>
        <div class="card-sub"><strong>Total:</strong> ${money(o.amount)}</div>
        ${o.status !== 'confirmed' ? `<div class="action-row"><button class="btn-confirm" onclick="setOrderStatus('${id}','confirmed')">Confirm</button></div>` : ''}
      </div>`;
    });
    $("ordersList").innerHTML = html;
  });
}

function setOrderStatus(id, status) { db.collection("orders").doc(id).update({ status: status }); }

function listenEvents() {
  db.collection("events").orderBy("createdAt", "asc").onSnapshot(snap => {
    if (snap.empty) { $("eventsList").innerHTML = '<p class="spinner">No events yet.</p>'; return; }
    let html = "";
    snap.forEach(doc => {
      const e = doc.data(); const id = doc.id;
      html += `<div class="card">
        <div class="card-header"><div class="card-title">${esc(e.title)}</div><button class="btn-delete" onclick="deleteEvent('${id}')">Delete</button></div>
        <div class="card-sub">${esc(e.date)}</div>
        <div class="card-sub">${money(e.price)}</div>
      </div>`;
    });
    $("eventsList").innerHTML = html;
  });
}

function deleteEvent(id) {
  if (confirm("Delete this event?")) db.collection("events").doc(id).delete();
}

function listenUsers() {
  db.collection("swifttrust_users").orderBy("createdAt", "desc").onSnapshot(snap => {
    if (snap.empty) { $("usersList").innerHTML = '<p class="spinner">No users yet.</p>'; return; }
    let html = "";
    snap.forEach(doc => {
      const u = doc.data();
      html += `<div class="card">
        <div class="card-title">${esc(u.fullName || "Unknown")}</div>
        <div class="card-sub">${esc(u.email)}</div>
        <div class="card-sub" style="font-size:.75rem;color:#888;">Joined: ${formatDate(u.createdAt)}</div>
      </div>`;
    });
    $("usersList").innerHTML = html;
  });
}

function openAddModal() { $("eventModal").classList.add("open"); }
function closeModal() { $("eventModal").classList.remove("open"); }
function addEvent(e) {
  e.preventDefault(); $("addEventBtn").disabled = true;
  db.collection("events").add({
    title: $("evTitle").value.trim(), date: $("evDate").value.trim(), venue: $("evVenue").value.trim(),
    price: parseFloat($("evPrice").value), image: $("evImage").value.trim(), description: $("evDesc").value.trim(), createdAt: Date.now()
  }).then(() => { closeModal(); e.target.reset(); $("addEventBtn").disabled = false; });
}
</script>
</body>
</html>
